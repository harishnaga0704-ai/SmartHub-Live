<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laptop Products</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body{
    background:#f4f6f9;
    font-family:Arial, sans-serif;
}
.product-card{
    background:#fff;
    border-radius:15px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    transition:.3s;
    position:relative;
}
.product-card:hover{
    transform:translateY(-8px);
}
.product-card img{
    height:220px;
    width:100%;
    object-fit:contain;
    padding:15px;
}
@media (max-width:576px){
.product-card img{
    height:170px;
}
}
.discount{
    position:absolute;
    top:10px;
    left:10px;
    background:#e53935;
    color:#fff;
    padding:5px 10px;
    border-radius:20px;
    font-size:13px;
    font-weight:bold;
}
.price{
    color:#198754;
    font-size:22px;
    font-weight:bold;
}
.old-price{
    color:gray;
    text-decoration:line-through;
}
.rating{
    color:#ff9800;
    font-size:18px;
}
.btn-cart{
    background:#ff9800;
    color:#fff;
}
.btn-buy{
    background:#198754;
    color:#fff;
}
</style>

</head>
<body>

<div class="container py-5">
<a href="{% url 'index' %}" class="btn btn-dark mb-4">← Back to Home</a>

<div class="row g-4" id="productRow"></div>

</div>

<script>

/* =========================================================
   LAPTOP PRODUCTS DATA
   To add a NEW product later, just add one more object below.
   image can be ANY online image URL (no upload needed).
   discount / rating are optional - leave "" if not needed.
========================================================= */
const products = [
  { name:"MacBook Air M4", price:94999, oldPrice:119999, discount:"20% OFF", rating:5,
    image:"https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcTxFQdDO3i21xogsBmHDvbBNiwic9wdT086-KXKUG70s3tdC9BweDdOAaXXGvk0qvyUdEQFkMxg0N-nnIxUa77D37yOQJ2_Aw" },

  { name:"Dell XPS 14", price:124999, oldPrice:159999, discount:"25% OFF", rating:5,
    image:"https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcRa3ecvCbBjVFHwY4XfYTNCnUY3sgu_ZRK7hcHv8Ifr6tqbKDEkhhluEzxWnFREUpR8rXc4KoMT-ibdgXB_ZQ72GN58YdEK3HIktGPyO5H-2kgmNL8d0oNI" },

  { name:"HP Spectre x360", price:109999, oldPrice:149999, discount:"30% OFF", rating:5,
    image:"https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcTtEKXmycISiYOJesFnJYBvQXn6Z3KUlCtHGxaTYKIwyfD92RI1feHvHneAA4Anu1iOdZCBKbyHcitIdm608xezOJHilhIgbBUBVaE_4Hc" },

  { name:"Lenovo Legion Pro 7", price:179999, oldPrice:219999, discount:"18% OFF", rating:5,
    image:"https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcQvZxhwDct8Jxm6FM4kStxJdpKmaV4XB6HehThfCQ0TqElPoWmlGHOJSBNZPCWfcy9QMUmYSaU4-41sqr5U4tbRxhpaiv594_c1Fdvmr-Pcb_TfhPGcPQ50RwicCzyIJCFv4rVhW_QUYQ&usqp=CAc" },

  { name:"ASUS ROG Zephyrus G16", price:164999, oldPrice:209999, discount:"22% OFF", rating:5,
    image:"https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcR6zDeLOo4mltAu7NKvg0JtscLxaxFC7EDydQtSf3QzaCkh4itFWw6uVupyuyUsKO7Nrzzxnl2YILcoS8e7rJFkM5XwGmVm8wPyeDkDhub4m9U--fKNEoPw" },

  { name:"Acer Predator Neo 16", price:114999, oldPrice:134999, discount:"15% OFF", rating:4,
    image:"https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcRjhwLueOSIwXYwbQ8xN6_jPNrnvQ4BbBuJHGybnCFod1cpb-lu7aikgAuLgzGrm9gwCPjJwhdB7s8JuF76uK481mHNpPPrz3tBPl4Upqk" },

  { name:"MSI Raider GE78", price:209999, oldPrice:259999, discount:"20% OFF", rating:5,
    image:"https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcT703sYwKe9Lt70SoTUpAcIIA6w0xJpBWUz8TadRTH8zr5bVLGd4vLFY8a2eOWKjjng_dPRjlfE5fkDiCGi00wo9_pThmFxY2ttRLBO9_OtMWX2vAsUghgPdQ" },

  { name:"Galaxy Book5 Pro", price:109999, oldPrice:132999, discount:"17% OFF", rating:4,
    image:"https://encrypted-tbn1.gstatic.com/shopping?q=tbn:ANd9GcSdaeHGu_hkL1tO7kxYMJK83oXIsL-iWj3bMoyYZiPqSxZg2EkrRYe9PulTXSkrgCOO4kE7EoLgwn1D8iooldwTIAG0Utv8zs6MCagKC6Zx" },

  { name:"HP Victus 15", price:69999, oldPrice:99999, discount:"35% OFF", rating:4,
    image:"https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcRlDM4dp30fRPiTJogv97jSuFXFKlCy8tW7utxSoKe3G63ZfgrEJy66rOWEoMAjxchJwzOqzSFXU8R1cmJO_6hYRMUlSyZLH01zEMUEVE5lxLqTXZvdQENE" },

  { name:"ASUS Vivobook S15", price:74999, oldPrice:104999, discount:"28% OFF", rating:4,
    image:"https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcSV5derhSHcbcbm2iZgw0XKwIM3S7GFS75dG19AFoEg-D_bt1l1me6hD_ZFYgHlUpLiUAoS2Qr6Oz0Ex0BbvllzP00EyBYlwDQqbyQI8daElr9WRQ0GgcSj" },

  { name:"Lenovo IdeaPad Slim 5", price:59999, oldPrice:79999, discount:"25% OFF", rating:4,
    image:"https://encrypted-tbn0.gstatic.com/shopping?q=tbn:ANd9GcSDx8AhLBuNBljzUq1K_9O7_5fr-vbWsX18UhAJkIgiekbXATv_MGLBYoX4ex1xv3WtUPuXl9svJk1dH8EJ9BwDZsx9MgMfPZw5JLy6UOh92gtOU6maS62wgQ" },

  { name:"Dell Inspiron 15", price:54999, oldPrice:80999, discount:"32% OFF", rating:4,
    image:"https://encrypted-tbn2.gstatic.com/shopping?q=tbn:ANd9GcR02Gc3rYyDesSFieTJRbm_WzdIk1Xb13kEXb4gLyPXVplhzh8smPVuMrkOcZJG0_7msXJrJOr5kX1SIdyYBzjtfZKgaXl2xwPN1m1XwfM2acLqDRCKKfGoLQ" }
];

{% for product in db_products %}
products.push({
  name: "{{ product.name|escapejs }}",
  price: {% if product.offer_price %}{{ product.offer_price|stringformat:".2f" }}{% else %}{{ product.price|stringformat:".2f" }}{% endif %},
  oldPrice: {% if product.offer_price and product.price != product.offer_price %}{{ product.price|stringformat:".2f" }}{% else %}null{% endif %},
  discount: "{% if product.discount_percent %}{{ product.discount_percent }}% OFF{% endif %}",
  rating: {{ product.rating|default:5|floatformat:"0" }},
  stock: {{ product.stock|default:0 }},
  image: "{% if product.image %}{{ product.image.url }}{% else %}https://placehold.co/300x300?text=No+Image{% endif %}"
});
{% endfor %}


function stars(n){
  return "★".repeat(n) + "☆".repeat(5-n);
}

function renderProducts(){
  const row = document.getElementById("productRow");
  let html = "";

  products.forEach(p => {
    html += `
    <div class="col-6 col-sm-6 col-md-4 col-lg-3">
      <div class="product-card">
        ${p.discount ? `<span class="discount">${p.discount}</span>` : ""}
        <img src="${p.image}" alt="${p.name}">
        <div class="p-3">
          <h5>${p.name}</h5>
          ${p.rating ? `<div class="rating">${stars(p.rating)}</div>` : ""}
          <div class="small mb-2 ${Number(p.stock ?? 10) > 5 ? "text-success" : Number(p.stock ?? 10) > 0 ? "text-warning" : "text-danger"}">${Number(p.stock ?? 10) > 5 ? `In Stock: ${p.stock ?? 10}` : Number(p.stock ?? 10) > 0 ? `Low Stock: ${p.stock}` : "Out of Stock"}</div>
          <p>
            <span class="price">₹${p.price.toLocaleString("en-IN")}</span><br>
            ${p.oldPrice ? `<span class="old-price">₹${p.oldPrice.toLocaleString("en-IN")}</span>` : ""}
          </p>
          <button class="btn btn-cart w-100 mb-2" ${Number(p.stock ?? 10) === 0 ? "disabled" : ""}
            onclick="addToCart('${p.name.replace(/'/g,"\\'")}', ${p.price}, '${p.image}')">
            Add to Cart
          </button>
          <button class="btn btn-buy w-100"
            onclick="buyNow('${p.name.replace(/'/g,"\\'")}', ${p.price}, '${p.image}')">
            Buy Now
          </button>
        </div>
      </div>
    </div>`;
  });

  row.innerHTML = html;
}

renderProducts();

function addToCart(name, price, image){

    let cart = JSON.parse(localStorage.getItem("cart")) || [];

    let index = cart.findIndex(item => item.name === name);

    if(index > -1){
        cart[index].quantity++;
    }else{
        cart.push({
            name: name,
            price: price,
            image: image,
            quantity: 1
        });
    }

    localStorage.setItem("cart", JSON.stringify(cart));

    alert(name + " Added to Cart");

    window.location.href = "{% url 'cart' %}";
}
function buyNow(name, price, image){

    const product = {
        name: name,
        price: price,
        image: image,
        quantity: 1
    };

    localStorage.setItem("buyNowProduct", JSON.stringify(product));
    localStorage.setItem("checkoutMode", "buy-now");
    window.location.href = "{% url 'checkout' %}";
}
</script>

</body>
</html>
