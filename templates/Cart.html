<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>.cart-item-img { width: 90px; height: 90px; object-fit: contain; }</style>
</head>
<body class="bg-light">
<main class="container py-5">
    <a href="{% url 'index' %}" class="btn btn-outline-dark mb-3">&larr; Back to Home</a>
    <h2 class="mb-4">My Cart</h2>
    <div id="cartItems"></div>
    <section class="card shadow-sm mt-4" id="checkoutCard" hidden>
        <div class="card-body">
            <h4 class="mb-2">Ready to checkout?</h4>
            <p class="text-muted mb-3">Enter your delivery address and choose a payment method on the next page.</p>
            <button class="btn btn-success" type="button" onclick="goToCheckout()">Proceed to Checkout</button>
        </div>
    </section>
</main>
<script>
let cart = JSON.parse(localStorage.getItem("cart")) || [];
function displayCart() {
    const cartItems = document.getElementById("cartItems");
    const checkoutCard = document.getElementById("checkoutCard");
    if (!cart.length) { cartItems.innerHTML = '<div class="alert alert-info">Your cart is empty.</div>'; checkoutCard.hidden = true; return; }
    cartItems.innerHTML = cart.map((item, index) => `
        <article class="card mb-3 shadow-sm"><div class="card-body d-flex flex-wrap justify-content-between align-items-center gap-3">
            <div class="d-flex align-items-center"><img src="${item.image || ''}" alt="${item.name}" class="cart-item-img me-3"><div><h5 class="mb-1">${item.name}</h5><p class="mb-0">₹${Number(item.price).toLocaleString("en-IN")} &times; ${item.quantity}</p></div></div>
            <button class="btn btn-outline-danger" onclick="removeItem(${index})">Remove</button>
        </div></article>`).join("");
    checkoutCard.hidden = false;
}
function removeItem(index) { cart.splice(index, 1); localStorage.setItem("cart", JSON.stringify(cart)); displayCart(); }
function goToCheckout() {
    localStorage.setItem("checkoutMode", "cart");
    localStorage.setItem("checkoutItems", JSON.stringify(cart));
    localStorage.removeItem("cart");
    cart = [];
    window.location.href = "{% url 'checkout' %}";
}
displayCart();
</script>
</body>
</html>
