<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<main class="container py-5" style="max-width: 760px;">
    <a href="{% url 'cart' %}" class="btn btn-outline-dark mb-3">&larr; Back to Cart</a>
    <h2 class="mb-4">Checkout</h2>
    <div id="emptyCheckout" class="alert alert-info" hidden>Your checkout has no items. <a href="{% url 'index' %}">Continue shopping</a>.</div>
    <div id="checkoutContent" class="row g-4">
        <section class="col-md-5"><div class="card shadow-sm"><div class="card-body"><h4>Order summary</h4><div id="orderItems"></div><hr><strong>Total: <span id="orderTotal"></span></strong></div></div></section>
        <section class="col-md-7"><div class="card shadow-sm"><div class="card-body">
            <h4 class="mb-3">Delivery & payment details</h4>
            <form id="orderForm">{% csrf_token %}
                <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" name="customer_name" required></div>
                <div class="row"><div class="col-md-6 mb-3"><label class="form-label">Email</label><input class="form-control" type="email" name="email" required></div><div class="col-md-6 mb-3"><label class="form-label">Phone</label><input class="form-control" type="tel" name="phone" required></div></div>
                <div class="mb-3"><label class="form-label">Delivery address</label><textarea class="form-control" name="address" rows="3" required></textarea></div>
                <fieldset class="mb-3"><legend class="fs-6">Mode of payment</legend><div class="form-check"><input class="form-check-input" type="radio" name="payment_method" value="GPAY" id="gpay" required><label class="form-check-label" for="gpay">GPay</label></div><div class="form-check"><input class="form-check-input" type="radio" name="payment_method" value="COD" id="cod"><label class="form-check-label" for="cod">Cash on Delivery (COD)</label></div></fieldset>
                <div id="orderError" class="alert alert-danger d-none"></div>
                <button class="btn btn-success w-100" type="submit">Place Order</button>
            </form>
        </div></div></section>
    </div>
    <div id="successMessage" class="alert alert-success mt-4 d-none" role="status"><strong>Order is placed!</strong> Thank you for shopping with us.</div>
</main>
<script>
const checkoutMode = localStorage.getItem("checkoutMode") || "cart";
const items = checkoutMode === "buy-now" ? [JSON.parse(localStorage.getItem("buyNowProduct") || "null")].filter(Boolean) : JSON.parse(localStorage.getItem("checkoutItems") || "[]");
const orderItems = document.getElementById("orderItems");
const checkoutContent = document.getElementById("checkoutContent");
if (!items.length) { document.getElementById("emptyCheckout").hidden = false; checkoutContent.hidden = true; }
else {
    orderItems.innerHTML = items.map(item => `<div class="d-flex justify-content-between py-1"><span>${item.name} &times; ${item.quantity}</span><span>₹${(Number(item.price) * item.quantity).toLocaleString("en-IN")}</span></div>`).join("");
    document.getElementById("orderTotal").textContent = "₹" + items.reduce((sum, item) => sum + Number(item.price) * item.quantity, 0).toLocaleString("en-IN");
}
document.getElementById("orderForm").addEventListener("submit", async event => {
    event.preventDefault(); const form = new FormData(event.currentTarget); const error = document.getElementById("orderError"); error.classList.add("d-none");
    const response = await fetch("{% url 'place_order' %}", { method: "POST", headers: { "Content-Type": "application/json", "X-CSRFToken": form.get("csrfmiddlewaretoken") }, body: JSON.stringify({ customer_name: form.get("customer_name"), email: form.get("email"), phone: form.get("phone"), address: form.get("address"), payment_method: form.get("payment_method"), items }) });
    const result = await response.json();
    if (!response.ok) { error.textContent = result.error || "Unable to place the order."; error.classList.remove("d-none"); return; }
    if (checkoutMode === "buy-now") localStorage.removeItem("buyNowProduct"); else localStorage.removeItem("checkoutItems");
    localStorage.removeItem("checkoutMode");
    window.alert(result.message || "Order placed successfully!");
    window.location.href = result.invoice_url;
});
</script>
</body>
</html>
