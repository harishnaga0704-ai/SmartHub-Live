<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - SMARTSY Electronics</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container mt-5">

    <a href="{% url 'index' %}" class="btn btn-outline-dark mb-3">← Back to Home</a>

    <div class="card shadow p-4">

        <h2 class="text-center mb-4">Contact Us</h2>

        <div id="feedbackAlert" class="alert alert-success alert-dismissible fade d-none" role="alert">
            <strong>Success!</strong> Feedback sent successfully.
            <button type="button" class="btn-close" aria-label="Close" onclick="this.parentElement.classList.add('d-none')"></button>
        </div>

        <form id="contactForm">

            <div class="mb-3">
                <label>Name</label>
                <input type="text" class="form-control" id="name" required>
            </div>

            <div class="mb-3">
                <label>Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>

            <div class="mb-3">
                <label>Phone Number</label>
                <input type="tel" class="form-control" id="phone" required>
            </div>

            <div class="mb-3">
                <label>Message</label>
                <textarea class="form-control" id="message" rows="5" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Send Message
            </button>

        </form>

    </div>

</div>

<script>
document.getElementById("contactForm").addEventListener("submit", function(e){

    e.preventDefault();

    let contact = {
        name: document.getElementById("name").value,
        email: document.getElementById("email").value,
        phone: document.getElementById("phone").value,
        message: document.getElementById("message").value
    };

    localStorage.setItem("contact", JSON.stringify(contact));

    document.getElementById("contactForm").reset();

    const feedbackAlert = document.getElementById("feedbackAlert");
    feedbackAlert.classList.remove("d-none");
    feedbackAlert.classList.add("show");
    feedbackAlert.scrollIntoView({ behavior: "smooth", block: "center" });
});
</script>

</body>
</html>
