<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account · SMARTSY</title><style>body{min-height:100vh;margin:0;display:grid;place-items:center;font-family:system-ui,sans-serif;background:radial-gradient(circle at top left,#2857bd,transparent 40%),#070b1b;color:#f8fbff}.card{width:min(92vw,430px);padding:2.3rem;border:1px solid #ffffff3d;border-radius:24px;background:#ffffff14;box-shadow:0 25px 60px #0008;backdrop-filter:blur(15px)}h1{margin-top:0}.field{margin:1rem 0}label{display:block;margin-bottom:.4rem;font-size:.9rem}input{width:100%;box-sizing:border-box;padding:.8rem;border:1px solid #ffffff42;border-radius:10px;background:#07122688;color:white}button{width:100%;padding:.9rem;border:0;border-radius:10px;background:#78dcff;color:#071226;font-weight:800;cursor:pointer}.errorlist{color:#ffbdc7;padding-left:1.2rem;font-size:.85rem}a{color:#91e6ff}</style></head><body><main class="card"><h1>Create account</h1><form method="post">{% csrf_token %}{% for field in form %}<div class="field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<button type="submit">Create account</button></form><p>Already have an account? <a href="{% url 'login' %}">Sign in</a></p></main></body></html>
