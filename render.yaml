services:
  - type: web
    name: smarthub
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DEBUG
        value: "False"
      - key: LOCAL_DEV
        value: "False"
      - key: DATABASE_URL
        fromDatabase:
          name: smarthub-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true

databases:
  - name: smarthub-db
    plan: free
    databaseName: smarthub
    user: smarthub_user
